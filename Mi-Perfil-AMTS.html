<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

 <title>Mi Perfil</title>
</head>
<body bgcolor="lightblue">
  <article>
<h2>Ana Maria Trejo Sanchez </h2>
<p>Estudiante de Ingenieria en Sistemas </p>


    <svg width="160" height="100">
      <circle cx="80" cy="50" r="50" fill="blue">
        <animate attributeName="fill" values="yellow;blue ;orange" dur="5s" repeatCount="indefinite" />
      </circle>
    </svg>

  
    <form>
    <p>Agrega un correo</p>
     <input type="email" placeholder="Correo" required><br>

    <p>Selecciona la fecha</p>
     <input type="date"><br>

    <p>Nivel de conocimiento</p>
     <input type="range" min="0" max="100"><br>

    <button type="submit">Enviar</button>
    </form>

     <details>
      <summary>Biografía</summary>
      <p>Me gusta aprender mas hacerca de base de datos</p>
    </details>
  </article>
</body>
</html>
