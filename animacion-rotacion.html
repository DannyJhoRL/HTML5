<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación de Rotación SVG</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        svg {
            border: 2px solid #333;
            background-color: #f0f0f0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Ejemplo de Animación de Rotación</h1>
    <p>Un rectángulo rota 360 grados sobre su propio centro de forma continua.</p>
    
    <svg width="400" height="200">
        
        <rect x="160" y="75" width="80" height="50" fill="#9C27B0">
            <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 200 100"
                to="360 200 100"
                dur="5s"
                repeatCount="indefinite" />
        </rect>
    </svg>

</body>
</html>
