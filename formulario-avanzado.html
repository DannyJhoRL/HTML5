<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Avanzado en HTML5</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 50px;
        }
        form {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        label, input, button {
            display: block;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        input:invalid {
            border: 2px dashed #ff0000;
        }
        button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Ejemplo de Formulario con Funciones Nativas de HTML5</h1>
    <p>Este formulario utiliza tipos de entrada avanzados y validación sin código adicional.</p>
    
    <form>
        <label for="email">Correo Electrónico (requerido):</label>
        <input type="email" id="email" name="email" required>

        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha">

        <label for="color">Elige tu color favorito:</label>
        <input type="color" id="color" name="color">

        <label for="rango">Elige un valor entre 0 y 10:</label>
        <input type="range" id="rango" name="rango" min="0" max="10" value="5">

        <label for="telefono">Número de teléfono (formato: XXX-XXX-XXXX):</label>
        <input type="tel" id="telefono" name="telefono" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        
        <button type="submit">Enviar Formulario</button>
    </form>

</body>
</html>
