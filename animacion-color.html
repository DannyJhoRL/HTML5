<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación de Cambio de Color SVG</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        svg {
            border: 2px solid #333;
            background-color: #f0f0f0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Ejemplo de Animación de Color</h1>
    <p>Un círculo cambia de color a través de una secuencia de colores predefinida.</p>
    
    <svg width="400" height="150">
        
        <circle cx="200" cy="75" r="40" fill="#FFC107">
            <animate 
                attributeName="fill" 
                values="#FFC107; #E91E63; #2196F3; #FFC107" 
                dur="6s" 
                repeatCount="indefinite" />
        </circle>
    </svg>

</body>
</html>
