<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil - Luis Alejandro</title>
</head>
<body>

  <section>
    <h2>Luis Alejandro Alcocer Marín</h2>
    <p>Estudiante de Ingeniería en Computación</p>

    <!-- Animación SVG -->
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="30" fill="skyblue">
        <animateTransform
          attributeName="transform"
          attributeType="XML"
          type="rotate"
          from="0 50 50"
          to="360 50 50"
          dur="5s"
          repeatCount="indefinite" />
      </circle>
    </svg>

    <!-- Formulario avanzado -->
    <form>
      <p><label>Fecha de nacimiento: <input type="date" name="fecha"></label></p>
      <p><label>Correo electrónico: <input type="email" name="correo"></label></p>
      <p><label>Nivel de experiencia: <input type="range" min="0" max="10" value="5"></label></p>
      <p><input type="submit" value="Enviar"></p>
    </form>

    <!-- Sección desplegable -->
    <details>
      <summary>Más sobre mí</summary>
      <p>Soy apasionado por el desarrollo web, la programación en Python y el diseño de sistemas. Me encanta aprender nuevas tecnologías y participar en proyectos creativos.</p>
    </details>
  </section>

</body>
</html>
